<!doctype html>
<html>

<head>
    <title>Projet lulu</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js">
    </script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script type="module" src="https://raw.githack.com/b2renger/microprojetar/main/lib/qrTunnel.js"></script>

</head>


<body style="margin : 0px; overflow: hidden;">
    <a-scene embedded
        arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best ; changeMatrixMode: modelViewMatrix;"
        vr-mode-ui="enabled: false"
        renderer="sortObjects: true; antialias: true; colorManagement: true; physicallyCorrectLights; logarithmicDepthBuffer: true;"
        smooth=" true" smoothCount="5" smoothTolerance=".05" smoothThreshold="5" sourceWidth="800" sourceHeight="600"
        displayWidth="1280" displayHeight="720">

        <a-marker type='barcode' value='0'>
            <a-image
             src="bardepala.jpg"
             position="0 0 0"
              rotation="270 0 0"
            width="1"
            height="1">
        </a-image>
             <a-text
        value="b"
        color="red"
        position="-0.35 0.05 0.01"
        width="1"
        align="center">
    </a-text>

    <a-text
        value="a"
        color="orange"
        position="-0.25 0.05 0.01"
        width="1"
        align="center">
    </a-text>

    <a-text
        value="r"
        color="yellow"
        position="-0.15 0.05 0.01"
        width="1"
        align="center">
    </a-text>

    <a-text
        value="d"
        color="green"
        position="-0.05 0.05 0.01"
        width="1"
        align="center">
    </a-text>

    <a-text
        value="e"
        color="cyan"
        position="0.05 0.05 0.01"
        width="1"
        align="center">
    </a-text>

    <a-text
        value="p"
        color="blue"
        position="0.15 0.05 0.01"
        width="1"
        align="center">
    </a-text>

    <a-text
        value="a"
        color="purple"
        position="0.25 0.05 0.01"
        width="1"
        align="center">
    </a-text>

    <a-text
        value="l"
        color="pink"
        position="0.35 0.05 0.01"
        width="1"
        align="center">
    </a-text>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
</body>
</html>
